name: Criteria CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "criteria/**"
      - ".github/workflows/criteria-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "criteria/**"
      - ".github/workflows/criteria-ci.yml"

permissions:
  contents: read

concurrency:
  group: criteria-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: criteria/requirements-ci.txt
      - run: pip install -r criteria/requirements-ci.txt
      - run: ruff check criteria --select F,E9
      - run: python -m pytest criteria -q
