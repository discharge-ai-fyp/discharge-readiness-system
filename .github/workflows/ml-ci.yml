name: ML CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"

permissions:
  contents: read

concurrency:
  group: ml-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Block data, model and credential files
        run: |
          bad=$(git ls-files | grep -E '\.(csv|joblib|pkl|pem|key)$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden files are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: Notebooks must have no outputs
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in glob.glob("ml/notebooks/*.ipynb"):
              nb = json.load(open(f))
              if any(c.get("outputs") for c in nb["cells"] if c["cell_type"] == "code"):
                  bad.append(f)
          if bad:
              print("Notebooks with outputs:", bad)
              sys.exit(1)
          PY

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: ruff check src tests --select F,E9
      - run: python -m pytest -q
