name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "criteria/**"
      - "ml/src/**"
      - "ml/tests/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "criteria/**"
      - "ml/src/**"
      - "ml/tests/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests ml/src ml/tests criteria --select F,E9
      - run: PYTHONPATH=backend:. python -m pytest backend/tests criteria -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag discharge-readiness-api:ci --file backend/Dockerfile .
